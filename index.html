<style>
/* ==========================================================================
   정희정 · 꽃폈네 디지털 우주 지도  —  style.css
   ========================================================================== */

/* ── tokens ─────────────────────────────────────────────── */
:root{
  --bg:#05060f;
  --bg-2:#080b1a;
  --ink:#f2f5ff;
  --ink-soft:#c9d3ec;
  --dim:#8b96b8;
  --line:rgba(255,255,255,.105);
  --line-strong:rgba(255,255,255,.2);
  --glass:rgba(13,17,36,.72);
  --glass-2:rgba(20,26,50,.72);
  --accent:#ffc857;
  --radius:22px;
  --topbar-h:66px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  overscroll-behavior:none;
}
body.list-open{overflow:hidden}
button{font-family:inherit;color:inherit}
a{color:inherit}
img,svg,canvas{display:block}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
kbd{
  font-family:var(--font);font-size:11px;line-height:1;padding:3px 5px;border-radius:6px;
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--dim);
}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;color:#ffd98a}
::selection{background:rgba(255,200,87,.28)}

/* ── 배경: 별 · 성운 ─────────────────────────────────────── */
#stars{
  position:fixed;inset:0;z-index:0;width:100%;height:100%;
  pointer-events:none;
}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.nebula span{
  position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.5;
  animation:nebulaDrift 26s var(--ease) infinite alternate;
}
.nebula-a{width:58vmax;height:56vmax;left:-16vmax;top:-18vmax;
  background:radial-gradient(circle at 50% 50%,rgba(120,70,220,.55),rgba(60,30,140,0) 68%);}
.nebula-b{width:52vmax;height:52vmax;right:-18vmax;bottom:-16vmax;
  background:radial-gradient(circle at 50% 50%,rgba(20,120,180,.42),rgba(10,50,120,0) 70%);
  animation-delay:-8s}
.nebula-c{width:40vmax;height:40vmax;left:42%;top:48%;
  background:radial-gradient(circle at 50% 50%,rgba(255,120,170,.16),rgba(255,120,170,0) 70%);
  animation-delay:-15s}
@keyframes nebulaDrift{
  from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(3vmax,-2vmax,0) scale(1.12)}
}

/* ── 상단 바 ─────────────────────────────────────────────── */
.topbar{
  position:fixed;z-index:45;inset:0 0 auto 0;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px clamp(14px,3vw,26px);
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,rgba(5,6,15,.86),rgba(5,6,15,0));
  backdrop-filter:blur(2px);
}
.brand{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  padding:6px 12px 6px 8px;border-radius:999px;
  border:1px solid transparent;transition:border-color .25s var(--ease),background .25s var(--ease);
}
.brand:hover,.brand:focus-visible{border-color:var(--line);background:rgba(255,255,255,.04);outline:none}
.brand-mark{display:grid;place-items:center;width:26px;height:26px;flex:none;
  filter:drop-shadow(0 0 10px rgba(255,180,71,.5))}
.brand-text{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.brand-text strong{font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand-text em{font-style:normal;font-size:14px;font-weight:500;color:#ffd98a}
.brand-sub{
  display:block;font-size:10.5px;letter-spacing:.16em;color:var(--dim);font-weight:500;
  text-transform:uppercase;margin-left:2px;
}
.tools{display:flex;align-items:center;gap:8px}
.pill{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  height:38px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:rgba(16,21,42,.6);
  color:var(--ink-soft);font-size:13px;font-weight:600;letter-spacing:-.01em;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .18s var(--ease),border-color .18s var(--ease),background .18s var(--ease),color .18s var(--ease);
}
.pill:hover{border-color:var(--line-strong);background:rgba(30,38,72,.78);color:#fff;transform:translateY(-1px)}
.pill:active{transform:translateY(0) scale(.98)}
.pill:focus-visible{outline:2px solid rgba(255,200,87,.75);outline-offset:2px}
.pill .ico{font-size:13px;line-height:1;filter:saturate(1.15)}
.pill-accent{
  border-color:rgba(255,200,87,.4);
  background:linear-gradient(180deg,rgba(255,200,87,.16),rgba(255,160,60,.08));
  color:#ffe6b0;
}
.pill-accent:hover{background:linear-gradient(180deg,rgba(255,200,87,.26),rgba(255,160,60,.14));border-color:rgba(255,200,87,.7)}
.pill[aria-pressed="true"]{border-color:rgba(143,184,255,.55);background:rgba(60,95,190,.24);color:#dbe8ff}

/* ── 무대(우주) ──────────────────────────────────────────── */
.stage{
  position:fixed;inset:0;z-index:10;
  display:grid;place-items:center;
  padding:calc(var(--topbar-h) + env(safe-area-inset-top,0px)) 0 0;
  transition:opacity .32s var(--ease);
}
body.list-open .stage{opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}

.solar{position:relative;width:100%;height:100%;min-height:0}

/* 궤도 */
.orbits{position:absolute;inset:0;pointer-events:none}
.orbit{
  position:absolute;left:50%;top:50%;
  border-radius:50%;
  border:1px solid rgba(160,190,255,.13);
  transform:translate(-50%,-50%);
  box-shadow:inset 0 0 40px rgba(120,160,255,.03);
}
.orbit.is-dashed{border-style:dashed;border-color:rgba(160,190,255,.1)}
.orbit::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  box-shadow:0 0 24px rgba(120,160,255,.06);
  pointer-events:none;
}

/* 태양 */
.sun{
  position:absolute;left:50%;top:50%;z-index:6;
  width:var(--sun,132px);height:var(--sun,132px);
  transform:translate(-50%,-50%);
  padding:0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;
  border-radius:50%;
}
.sun-core{
  position:absolute;inset:18%;
  border-radius:50%;
  background:
    radial-gradient(circle at 34% 30%,#fffdf2 0%,#ffe9a8 32%,#ffc857 58%,#ff9d3c 82%,#f4741f 100%);
  box-shadow:
    0 0 22px rgba(255,215,120,.9),
    0 0 60px rgba(255,170,60,.55),
    0 0 130px rgba(255,140,50,.32),
    inset 0 -8px 22px rgba(200,80,0,.35);
  animation:sunBreathe 6.5s ease-in-out infinite;
}
.sun-corona{
  position:absolute;inset:-12%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,205,110,.42),rgba(255,160,60,.12) 45%,rgba(255,140,50,0) 72%);
  filter:blur(10px);
  animation:sunBreathe 6.5s ease-in-out infinite reverse;
}
.sun-flare{
  position:absolute;inset:-32%;border-radius:50%;
  background:conic-gradient(from 0deg,
    rgba(255,210,130,.16) 0deg,transparent 16deg,transparent 30deg,
    rgba(255,190,100,.13) 44deg,transparent 60deg,transparent 96deg,
    rgba(255,210,130,.14) 112deg,transparent 130deg,transparent 168deg,
    rgba(255,190,100,.12) 182deg,transparent 200deg,transparent 236deg,
    rgba(255,210,130,.15) 250deg,transparent 268deg,transparent 300deg,
    rgba(255,190,100,.12) 314deg,transparent 330deg,transparent 360deg);
  filter:blur(14px);opacity:.85;
  animation:spin 90s linear infinite;
  pointer-events:none;
}
.sun-label{
  position:absolute;top:calc(100% - 6px);left:50%;transform:translateX(-50%);
  text-align:center;white-space:nowrap;pointer-events:none;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}
.sun-label strong{
  display:block;font-size:15px;font-weight:700;color:#fff1cf;
  letter-spacing:-.01em;
}
.sun-label em{
  display:block;font-style:normal;font-size:10.5px;color:rgba(255,235,190,.55);
  letter-spacing:.02em;margin-top:2px;
}
.sun:hover .sun-core,.sun:focus-visible .sun-core{animation-duration:3s}
.sun:focus-visible{outline:2px solid rgba(255,215,120,.8);outline-offset:6px}
@keyframes sunBreathe{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.055);opacity:.94}
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 행성 */
.planet-layer{position:absolute;inset:0}
.planet{
  position:absolute;left:0;top:0;
  width:var(--size,86px);height:var(--size,86px);
  transform:translate(-50%,-50%);
  padding:0;border:0;border-radius:50%;cursor:pointer;
  background:none;
  transition:filter .25s var(--ease);
  will-change:transform,left,top;
  -webkit-tap-highlight-color:transparent;
}
.planet-body{
  position:absolute;inset:0;border-radius:50%;
  display:grid;place-items:center;
  background:var(--c);
  background:
    radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--c) 82%,#fff 18%) 0%,var(--c) 46%,color-mix(in srgb,var(--c) 55%,#0a0d1c 45%) 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.13),0 8px 26px rgba(0,0,0,.45);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.13),
    0 8px 26px rgba(0,0,0,.45),
    0 0 34px color-mix(in srgb,var(--c) 45%,transparent);
  transition:transform .28s var(--ease),box-shadow .28s var(--ease);
  overflow:hidden;
}
.planet-body::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 70% 78%,rgba(0,0,0,.34),transparent 62%);
  mix-blend-mode:multiply;
}
.planet-ico{
  position:relative;z-index:2;
  font-size:calc(var(--size,86px) * .4);line-height:1;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));
  transform:translateY(1px);
}
.planet-ring{
  position:absolute;inset:-9%;border-radius:50%;
  border:1px solid rgba(255,255,255,.28);
  border-color:color-mix(in srgb,var(--c) 60%,transparent);
  opacity:.5;transform:rotate(-18deg) scaleY(.42);
  transition:opacity .3s var(--ease),transform .3s var(--ease);
  pointer-events:none;
}
.planet-name{
  position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);
  white-space:nowrap;font-size:var(--label,12.5px);font-weight:650;
  color:#e8eeff;letter-spacing:-.015em;
  text-shadow:0 2px 10px rgba(0,0,0,.9),0 0 20px rgba(0,0,0,.6);
  transition:color .25s var(--ease),text-shadow .25s var(--ease);
}
.planet-count{
  position:absolute;left:50%;top:calc(100% + 9px + var(--label,12.5px) + 5px);
  transform:translateX(-50%);
  font-size:10.5px;font-weight:500;color:rgba(190,205,235,.62);white-space:nowrap;
  letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.9);
}
.planet:hover .planet-body,.planet:focus-visible .planet-body{
  transform:scale(1.085);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.3),
    0 10px 30px rgba(0,0,0,.5),
    0 0 48px color-mix(in srgb,var(--c) 62%,transparent);
}
.planet:hover .planet-ring{opacity:1;transform:rotate(-18deg) scaleY(.5) scale(1.06)}
.planet:hover .planet-name{color:#fff}
.planet:focus-visible{outline:none}
.planet:focus-visible .planet-body{outline:2px solid rgba(255,255,255,.9);outline-offset:3px}
.planet.is-active .planet-body{
  box-shadow:
    0 0 0 2px rgba(255,255,255,.85),
    0 0 0 7px color-mix(in srgb,var(--c) 30%,transparent),
    0 0 60px color-mix(in srgb,var(--c) 70%,transparent);
}
.planet.is-active .planet-name{color:#fff}
.planet.is-dim{opacity:.42;filter:saturate(.5)}
.planet.is-offscreen{opacity:.55}
.planet.pulse .planet-body{animation:planetPulse 2.6s ease-in-out infinite}
@keyframes planetPulse{
  0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.16),0 8px 26px rgba(0,0,0,.45),0 0 26px color-mix(in srgb,var(--c) 40%,transparent)}
  50%{box-shadow:0 0 0 1px rgba(255,255,255,.22),0 8px 26px rgba(0,0,0,.45),0 0 50px color-mix(in srgb,var(--c) 72%,transparent)}
}

/* 안내 · 개수 */
.hint{
  position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  margin:0;display:flex;align-items:center;gap:8px;
  font-size:12px;color:rgba(180,196,230,.66);white-space:nowrap;
  padding:8px 14px;border-radius:999px;
  border:1px solid rgba(255,255,255,.07);background:rgba(10,14,30,.5);
  backdrop-filter:blur(8px);
  transition:opacity .4s var(--ease);
}
.hint-dot{width:5px;height:5px;border-radius:50%;background:#ffc857;box-shadow:0 0 8px #ffc857}
.hint-sep{opacity:.4}
body.list-open .hint{opacity:0}
.count-badge{
  position:absolute;left:50%;top:calc(var(--topbar-h) + 6px);transform:translateX(-50%);
  font-size:11px;letter-spacing:.14em;color:rgba(170,188,225,.5);
  text-transform:uppercase;pointer-events:none;
}

/* ── 우측 패널 (데스크톱) ─────────────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:48;
  background:rgba(3,5,12,.6);backdrop-filter:blur(3px);
  opacity:0;transition:opacity .3s var(--ease);
}
.scrim.show{opacity:1}

.panel{
  position:fixed;z-index:50;top:0;right:0;bottom:0;
  width:min(462px,94vw);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(15,19,40,.96),rgba(8,11,25,.98));
  border-left:1px solid var(--line);
  box-shadow:-30px 0 70px rgba(0,0,0,.55);
  transform:translateX(102%);
  transition:transform .42s var(--ease);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  padding-top:env(safe-area-inset-top,0px);
}
.panel.open{transform:translateX(0)}
.panel-grip{display:none}
.panel-scroll{overflow-y:auto;overscroll-behavior:contain;padding:26px 24px 40px;scrollbar-width:thin}
.panel-scroll::-webkit-scrollbar{width:9px}
.panel-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:9px;border:3px solid transparent;background-clip:padding-box}

.panel-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;position:relative}
.panel-orb{
  flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  font-size:24px;background:var(--c);
  background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--c) 82%,#fff 18%),var(--c) 52%,color-mix(in srgb,var(--c) 50%,#0a0d1c 50%));
  box-shadow:0 0 0 1px rgba(255,255,255,.16),0 0 26px rgba(0,0,0,.3);
  box-shadow:0 0 0 1px rgba(255,255,255,.16),0 0 26px color-mix(in srgb,var(--c) 48%,transparent);
}
.panel-id{min-width:0;flex:1}
.panel-sub{margin:2px 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 78%,#fff 22%);font-weight:600}
.panel-title{margin:0;font-size:22px;font-weight:750;letter-spacing:-.03em;line-height:1.24}
.panel-close{
  flex:none;width:34px;height:34px;border-radius:50%;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--ink-soft);font-size:14px;display:grid;place-items:center;
  transition:background .2s var(--ease),transform .2s var(--ease);
}
.panel-close:hover{background:rgba(255,255,255,.13);transform:rotate(90deg)}
.panel-summary{
  margin:0 0 20px;font-size:13.5px;line-height:1.66;color:var(--ink-soft);
  padding-bottom:18px;border-bottom:1px solid var(--line);
}
.panel-list{display:flex;flex-direction:column;gap:12px}
.panel-foot{margin-top:22px;font-size:11.5px;color:rgba(160,175,205,.55);text-align:center;letter-spacing:.06em}

/* 자료 카드 */
.item{
  border:1px solid var(--line);border-radius:18px;
  background:rgba(255,255,255,.032);
  padding:16px 16px 14px;
  transition:border-color .22s var(--ease),background .22s var(--ease),transform .22s var(--ease);
  scroll-margin-top:20px;
}
.item:hover{border-color:color-mix(in srgb,var(--c) 42%,rgba(255,255,255,.16));background:rgba(255,255,255,.055)}
.item.flash{animation:flash 1.5s var(--ease)}
@keyframes flash{
  0%,100%{box-shadow:0 0 0 0 transparent}
  20%,60%{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent),0 0 30px color-mix(in srgb,var(--c) 40%,transparent)}
}
.item-meta{
  display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  color:color-mix(in srgb,var(--c) 80%,#fff 20%);
  margin-bottom:7px;
}
.item-title{margin:0 0 7px;font-size:15.5px;font-weight:700;letter-spacing:-.02em;line-height:1.4}
.item-desc{margin:0;font-size:13px;line-height:1.68;color:var(--ink-soft)}
.item-tags{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 0;padding:0;list-style:none}
.item-tags li{
  font-size:10.5px;padding:3px 8px;border-radius:999px;
  background:rgba(255,255,255,.06);color:rgba(200,212,240,.78);
  border:1px solid rgba(255,255,255,.05);
}
.item-details{margin-top:11px;border-top:1px dashed rgba(255,255,255,.12);padding-top:9px}
.item-details summary{
  cursor:pointer;font-size:11.5px;color:color-mix(in srgb,var(--c) 75%,#fff 25%);
  list-style:none;display:flex;align-items:center;gap:6px;
}
.item-details summary::-webkit-details-marker{display:none}
.item-details summary::before{content:"▸";transition:transform .2s var(--ease);display:inline-block}
.item-details[open] summary::before{transform:rotate(90deg)}

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);

        r: Math.random() * 1.15 + 0.3,
        a: Math.random() * 0.45 + 0.25,
        sp: Math.random() * 1.1 + 0.35,
        ph: Math.random() * Math.PI * 2,
        depth: Math.random() * 0.8 + 0.2,
        tint: Math.random() < 0.1 ? 'warm' : (Math.random() < 0.18 ? 'cool' : 'plain')
      });
    }
  }

  function drawStars(now) {
    ctx.clearRect(0, 0, cw, ch);
    pointer.x += (pointer.tx - pointer.x) * 0.06;
    pointer.y += (pointer.ty - pointer.y) * 0.06;

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = reduceMotion ? 1 : (0.72 + 0.28 * Math.sin(now * 0.001 * s.sp + s.ph));
      var alpha = clamp(s.a * tw, 0.05, 0.95);
      var x = s.x + pointer.x * s.depth * 16;
      var y = s.y + pointer.y * s.depth * 16;
      var color = s.tint === 'warm' ? '255,226,170' : s.tint === 'cool' ? '175,215,255' : '235,242,255';
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + color + ',' + alpha + ')';
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.r > 1.15) {
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + color + ',' + (alpha * 0.14) + ')';
        ctx.arc(x, y, s.r * 3.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* 슈팅스타 */
    if (!reduceMotion) {
      if (!shoot && now > nextShootAt) {
        var fromLeft = Math.random() > 0.5;
        shoot = {
          x: fromLeft ? -40 : cw + 40,
          y: Math.random() * ch * 0.55,
          vx: (fromLeft ? 1 : -1) * (5.5 + Math.random() * 3),
          vy: 2.2 + Math.random() * 1.6,
          life: 0,
          max: 70 + Math.random() * 30
        };
      }
      if (shoot) {
        shoot.x += shoot.vx;
        shoot.y += shoot.vy;
        shoot.life++;
        var p = 1 - shoot.life / shoot.max;
        if (p <= 0) {
          shoot = null;
          nextShootAt = now + 7000 + Math.random() * 9000;
        } else {
          var len = 90;
          var grad = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * (len / 6), shoot.y - shoot.vy * (len / 6));
          grad.addColorStop(0, 'rgba(255,255,255,' + (0.85 * p) + ')');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(shoot.x, shoot.y);
          ctx.lineTo(shoot.x - shoot.vx * (len / 6), shoot.y - shoot.vy * (len / 6));
          ctx.stroke();
        }
      }
    }
  }

  /* ── 태양계 배치 ─────────────────────────────────────────── */
  var RING = [
    { k: 0.47, speed: 0.85, size: 0.25 },
    { k: 0.72, speed: 0.6, size: 0.225 },
    { k: 0.96, speed: 0.44, size: 0.20 }
  ];
  var nodes = [];        // {el, planet, size}
  var geom = { cx: 0, cy: 0, ryFactor: 1, R: 0 };
  var elapsed = 0;

  function buildPlanets() {
    orbitLayer.innerHTML = '';
    planetLayer.innerHTML = '';
    nodes = [];

    for (var r = 0; r < RING.length; r++) {
      var ring = document.createElement('div');
      ring.className = 'orbit' + (r === 1 ? ' is-dashed' : '');
      ring.dataset.ring = String(r);
      orbitLayer.appendChild(ring);
    }

    PLANETS.forEach(function (p, idx) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'planet pulse';
      btn.dataset.id = p.id;
      btn.style.setProperty('--c', p.accent);
      btn.setAttribute('aria-label', p.name + ' — 자료 ' + p.items.length + '개 열기');
      btn.innerHTML =
        '<span class="planet-ring" aria-hidden="true"></span>' +
        '<span class="planet-body"><span class="planet-ico" aria-hidden="true">' + p.icon + '</span></span>' +
        '<span class="planet-name">' + esc(p.name) + '</span>' +
        '<span class="planet-count">자료 ' + p.items.length + '</span>';
      btn.addEventListener('click', function () { togglePlanet(p.id); });
      btn.addEventListener('mouseenter', function () { hoverPlanet = true; });
      btn.addEventListener('mouseleave', function () { hoverPlanet = false; });
      btn.addEventListener('focus', function () { hoverPlanet = true; });
      btn.addEventListener('blur', function () { hoverPlanet = false; });
      planetLayer.appendChild(btn);
      nodes.push({ el: btn, planet: p, ring: clamp((p.orbit || 1) - 1, 0, 2), idx: idx });
    });

    setTimeout(function () {
      nodes.forEach(function (n) { n.el.classList.remove('pulse'); });
    }, 5200);
  }

  function layoutSolar() {
    var W = solar.clientWidth;
    var H = solar.clientHeight;
    if (!W || !H) return;

    geom.cx = W / 2;
    geom.cy = H / 2;
    geom.R = Math.min(W * 0.455, H * 0.405);
    geom.ryFactor = clamp((H / W) * 0.54, 0.72, 1.2);

    var sunSize = clamp(geom.R * 0.30, 72, 152);
    solar.style.setProperty('--sun', sunSize + 'px');

    var labelSize = clamp(geom.R * 0.040, 10, 13);

    nodes.forEach(function (n) {
      var ringCfg = RING[n.ring];
      var size = clamp(geom.R * ringCfg.size, 42, 96);
      n.el.style.width = size + 'px';
      n.el.style.height = size + 'px';
      n.el.style.setProperty('--size', size + 'px');
      n.el.style.setProperty('--label', labelSize + 'px');
      n.size = size;
      var nameEl = n.el.querySelector('.planet-name');
      if (nameEl) nameEl.textContent = (window.innerWidth < 560 && n.planet.short) ? n.planet.short : n.planet.name;
    });

    /* 궤도 링 크기 */
    $$('.orbit', orbitLayer).forEach(function (ring, i) {
      var rr = geom.R * RING[i].k;
      var ry = rr * geom.ryFactor;
      ring.style.width = (rr * 2) + 'px';
      ring.style.height = (ry * 2) + 'px';
    });

    positionPlanets();
  }

  function positionPlanets(animate) {
    nodes.forEach(function (n) {
      var ringCfg = RING[n.ring];
      var rr = geom.R * ringCfg.k;
      var ry = rr * geom.ryFactor;
      var deg = n.planet.angle + (reduceMotion ? 0 : elapsed * ringCfg.speed);
      var rad = (deg * Math.PI) / 180;
      var x = rr * Math.cos(rad);
      var y = ry * Math.sin(rad);
      n.el.style.left = '50%';
      n.el.style.top = '50%';
      n.el.style.transform = 'translate(-50%,-50%) translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px)';
      /* 화면 밖으로 나간 행성은 살짝 흐리게 */
      var outside = Math.abs(x) > geom.cx - n.size * 0.4 || Math.abs(y) > geom.cy - n.size * 0.4;
      n.el.classList.toggle('is-offscreen', outside);
    });
  }

  /* ── 애니메이션 루프 ─────────────────────────────────────── */
  var hoverPlanet = false;
  var lastT = 0;
  function paused() {
    return reduceMotion || panel.classList.contains('open') || !listView.hidden ||
      !searchOverlay.hidden || !qrOverlay.hidden || document.hidden || hoverPlanet;
  }
  function frame(now) {
    if (!lastT) lastT = now;
    var dt = Math.min(64, now - lastT);
    lastT = now;
    if (!paused()) {
      elapsed += dt / 1000;
      positionPlanets();
    }
    drawStars(now);
    requestAnimationFrame(frame);
  }

  /* ── 패널 ────────────────────────────────────────────────── */
  var currentId = null;

  function linksHTML(item) {

  /* ── 검색 ───────────────────────────────────────────────── */
  var INDEX = [];
  PLANETS.forEach(function (p) {
    p.items.forEach(function (it, i) {
      INDEX.push({
        planet: p,
        order: i,
        title: it.title,
        desc: it.desc,
        meta: it.meta || '',
        tags: (it.tags || []).join(' '),
        links: (it.links || []).map(function (l) { return l.label; }).join(' ')
      });
    });
  });

  var searchActive = -1;

  function score(entry, q) {
    var t = entry.title.toLowerCase();
    var tag = entry.tags.toLowerCase();
    var meta = entry.meta.toLowerCase();
    var d = entry.desc.toLowerCase();
    if (t === q) return 100;
    if (t.indexOf(q) === 0) return 90;
    if (t.indexOf(q) > -1) return 80;
    if (tag.indexOf(q) > -1) return 60;
    if (meta.indexOf(q) > -1) return 50;
    if (d.indexOf(q) > -1) return 30;
    if (entry.planet.name.toLowerCase().indexOf(q) > -1) return 20;
    return 0;
  }

  function runSearch(raw) {
    var q = raw.trim().toLowerCase();
    searchActive = -1;
    if (!q) {
      searchMeta.innerHTML = '전체 자료 <b>' + TOTAL_ITEMS + '</b>개 · 행성 <b>' + PLANETS.length + '</b>개';
      searchResults.innerHTML =
        '<div class="search-chips">' + PLANETS.map(function (p) {
          return '<button type="button" data-cat="' + esc(p.id) + '">' + p.icon + ' ' + esc(p.name) + '</button>';
        }).join('') + '</div>' +
        '<div class="search-hint"><span><kbd>↑</kbd><kbd>↓</kbd> 이동</span><span><kbd>Enter</kbd> 열기</span><span><kbd>Esc</kbd> 닫기</span></div>';
      $$('.search-chips button', searchResults).forEach(function (b) {
        b.addEventListener('click', function () {
          closeSearch();
          openPlanet(b.dataset.cat);
        });
      });
      return;
    }

    var hits = INDEX.map(function (e) { return { e: e, s: score(e, q) }; })
      .filter(function (h) { return h.s > 0; })
      .sort(function (a, b) { return b.s - a.s; });

    searchMeta.innerHTML = '‘' + esc(raw.trim()) + '’ 검색 결과 <b>' + hits.length + '</b>개';

    if (!hits.length) {
      searchResults.innerHTML = '<div class="search-empty">‘' + esc(raw.trim()) + '’에 맞는 자료가 없습니다.<br>행성 이름이나 다른 키워드로 찾아보세요.</div>';
      return;
    }

    searchResults.innerHTML = hits.map(function (h, i) {
      var e = h.e;
      return '<button type="button" class="sr" data-planet="' + esc(e.planet.id) + '" data-order="' + e.order + '" data-i="' + i + '" ' +
        'style="--c:' + e.planet.accent + '">' +

        '<span class="sr-main">' +
          '<span class="sr-title">' + highlight(e.title, raw.trim()) + '</span>' +
          '<span class="sr-desc">' + highlight(e.desc, raw.trim()) + '</span>' +
        '</span>' +
        '<span class="sr-cat">' + esc(e.planet.name) + '</span>' +
        '</button>';
    }).join('');

    $$('.sr', searchResults).forEach(function (btn) {
      btn.addEventListener('click', function () {
        closeSearch();
        openPlanet(btn.dataset.planet, { focusItem: Number(btn.dataset.order) });
      });
    });
  }

  function moveActive(dir) {
    var items = $$('.sr', searchResults);
    if (!items.length) return;
    searchActive = (searchActive + dir + items.length) % items.length;

  function openSearch() {

  /* ── QR ─────────────────────────────────────────────────── */
  function currentURL() {
    return location.origin + location.pathname;
  }

  function buildQR() {
    var url = currentURL();
    $('#qrUrl').textContent = url;
    if (typeof window.qrcode !== 'function') {
      toast('QR 생성 도구를 불러오지 못했습니다');
      return;
    }
    var qr = window.qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    var n = qr.getModuleCount();
    var quiet = 4;
    var total = n + quiet * 2;
    var cell = Math.max(2, Math.floor(512 / total));
    var size = cell * total;
    qrCanvas.width = size;
    qrCanvas.height = size;
    var g = qrCanvas.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, size, size);
    g.fillStyle = '#0b1020';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) {
          g.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
        }
      }
    }
  }

  function openQR() {
    buildQR();
    qrOverlay.hidden = false;
    setTimeout(function () { $('#qrClose').focus({ preventScroll: true }); }, 60);
  }
  function closeQR() { qrOverlay.hidden = true; }

  $('#qrBtn').addEventListener('click', openQR);
  $('#qrClose').addEventListener('click', closeQR);
  qrOverlay.addEventListener('click', function (e) {
    if (e.target.dataset && e.target.dataset.close === 'qr') closeQR();
  });
  $('#qrCopy').addEventListener('click', function () {
    copyText(currentURL()).then(function (ok) {
      toast(ok ? '주소를 복사했습니다' : '복사가 막혔습니다. 주소를 길게 눌러 복사해 주세요');
    });
  });
  $('#qrSave').addEventListener('click', function () {
    try {
      var a = document.createElement('a');
      a.href = qrCanvas.toDataURL('image/png');
      a.download = 'kkotponne-universe-qr.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast('QR 이미지를 저장했습니다');
    } catch (e) {
      toast('이미지 저장이 막혔습니다');
    }
  });

  /* ── 키보드 · 라우팅 ─────────────────────────────────────── */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
    if (e.key === 'Escape') {
      if (!qrOverlay.hidden) { closeQR(); return; }
      if (!searchOverlay.hidden) { closeSearch(); return; }
      if (panel.classList.contains('open')) { closePanel(); return; }
      if (!listView.hidden) { setListMode(false); return; }
    }
    if (!typing && (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'))) {
      e.preventDefault();
      openSearch();
    }
  });

  function routeFromHash() {
    var id = (location.hash || '').replace('#', '');
    if (!id) return;
    if (id === 'about') openAbout();
    else if (planetById(id)) openPlanet(id);
    else if (id.indexOf('list-') === 0) {
      setListMode(true, false);
      var el = document.getElementById(id);
      if (el) el.scrollIntoView({ block: 'start' });
    }
  }
  window.addEventListener('hashchange', routeFromHash);
  window.addEventListener('popstate', routeFromHash);

  /* ── 포인터 시차 ─────────────────────────────────────────── */
  stage.addEventListener('pointermove', function (e) {
    pointer.tx = (e.clientX / window.innerWidth - 0.5) * 2;
    pointer.ty = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  /* ── 리사이즈 · 시작 ─────────────────────────────────────── */
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      sizeStars();
      layoutSolar();
    }, 120);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { sizeStars(); layoutSolar(); }, 260);
  });

  function init() {
    var title = DATA.owner.name + ' · ' + DATA.owner.brand + ' — 디지털 우주 지도';
    document.title = title;

    $('#countBadge').textContent = '행성 ' + PLANETS.length + ' · 자료 ' + TOTAL_ITEMS;
    searchMeta.innerHTML = '전체 자료 <b>' + TOTAL_ITEMS + '</b>개 · 행성 <b>' + PLANETS.length + '</b>개';

    sizeStars();
    buildPlanets();
    layoutSolar();
    requestAnimationFrame(frame);

    var saved = null;
    try { saved = localStorage.getItem('kpu-view'); } catch (e) {}
    if (saved === 'list') setListMode(true, false);
    else renderList();

    routeFromHash();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
